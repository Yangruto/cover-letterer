<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frank's AI Cover-Letterer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f9;
      --glow: rgba(51, 71, 176, .10);
      --surface: #ffffff;
      --soft: #f1f4f9;
      --ink: #172033;
      --muted: #627086;
      --line: #e0e5ee;
      --accent: #3347b0;
      --accent-ink: #ffffff;
      --accent-soft: rgba(51, 71, 176, .09);
      --error: #a13a2f;
      --shadow: 0 14px 34px -16px rgba(23, 32, 51, .28);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111823;
        --glow: rgba(127, 156, 240, .12);
        --surface: #19222f;
        --soft: #212c3b;
        --ink: #e8edf4;
        --muted: #9aa8ba;
        --line: #2c3a4b;
        --accent: #7f9cf0;
        --accent-ink: #0e1521;
        --accent-soft: rgba(127, 156, 240, .14);
        --error: #f08a7f;
        --shadow: 0 14px 34px -16px rgba(0, 0, 0, .6);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(900px 380px at 50% -8%, var(--glow), transparent), var(--bg);
      color: var(--ink);
      font: 16px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(760px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 1. Header */
    header {
      padding: 22px 26px 6px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 999px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -.01em;
      margin: 0;
      line-height: 1.2;
    }

    /* 2. Description */
    .description {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .93rem;
      max-width: 60ch;
    }

    /* 3. Chat window */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin: 16px 0 0;
      padding: 18px 26px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      max-width: 34ch;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.assistant {
      background: var(--soft);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: var(--accent);
      color: var(--accent-ink);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.error {
      color: var(--error);
    }

    /* Cover letter: its own bubble, visually distinct */
    .msg.summary {
      max-width: 92%;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
    }

    .msg.summary::before {
      content: "Cover Letter";
      display: block;
      margin-bottom: 6px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .msg a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }

    /* Centered notice, e.g. when the question limit is reached */
    .note {
      align-self: center;
      text-align: center;
      max-width: 90%;
      font-size: .82rem;
      color: var(--muted);
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      white-space: normal;
    }

    .sources .label {
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .chip {
      font-size: .76rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      padding: 5px 0;
    }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: .5;
    }

    @media (prefers-reduced-motion: no-preference) {
      .dots i {
        animation: pulse 1.1s infinite ease-in-out;
      }

      .dots i:nth-child(2) {
        animation-delay: .15s;
      }

      .dots i:nth-child(3) {
        animation-delay: .3s;
      }

      @keyframes pulse {

        0%,
        80%,
        100% {
          opacity: .25;
        }

        40% {
          opacity: 1;
        }
      }

      .msg {
        animation: in .18s ease-out;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
    }

    /* 4. Input block + send button */
    #form {
      display: flex;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
    }

    #input {
      flex: 1;
      font: inherit;
      color: var(--ink);
      background: var(--soft);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
    }

    #input::placeholder {
      color: var(--muted);
    }

    #input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }

    #input:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #send {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: inherit;
      font-weight: 500;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      cursor: pointer;
    }

    #send:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #send svg {
      width: 16px;
      height: 16px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      body {
        padding: 0;
      }

      .app {
        height: 100%;
        border-radius: 0;
        border: 0;
      }

      header {
        padding: 18px 18px 4px;
      }

      #chat {
        padding: 14px 18px;
      }

      #form {
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      }

      #send span {
        display: none;
      }

      #send {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <span class="eyebrow">Applied AI · RAG demo</span>
      <h1>Frank's AI Cover-Letterer</h1>
      <p class="description"><strong>AI Cover Letterer</strong> 是一位熱心的 AI
        Agent 想幫助我找到好工作，他會認真的搜尋我的資料並回答您的問題。快透過發問來更認識我吧！<br>
        *問完五個問題後，會自動產生一封 Cover Letter。
      </p>
    </header>

    <div id="chat" aria-live="polite">
      <div class="empty" id="empty">
        <strong>Ask a question to get started...</strong>
        For example: 他會開發AI嗎？
      </div>
    </div>

    <form id="form">
      <input id="input" type="text" autocomplete="off" maxlength="500" placeholder="Type your question"
        aria-label="Your question">
      <button id="send" type="submit" aria-label="Send">
        <span>Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </form>
  </main>

  <script>
    const MAX_QUESTIONS = 5;      // after this many questions the input is locked
    const SEP = "\x1e";           // backend sends this before the cover letter -> new bubble
    const SUMMARY_DELAY_MS = 3000; // pause (with loading dots) before the cover letter appears

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const chatHistory = [];       // {role: "user" | "assistant", content}
    let locked = false;

    function addMessage(role, text, extra = "") {
      const empty = document.getElementById("empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = `msg ${role} ${extra}`.trim();
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function addNote(text) {
      const el = document.createElement("div");
      el.className = "note";
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function showThinking(el) {
      el.textContent = "";
      const dots = document.createElement("span");
      dots.className = "dots";
      dots.setAttribute("role", "status");
      dots.setAttribute("aria-label", "Thinking");
      dots.innerHTML = "<i></i><i></i><i></i>";
      el.appendChild(dots);
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // ASCII-only URL characters, so a Chinese character right after a URL is not swallowed.
    const URL_RE = /https?:\/\/[A-Za-z0-9\-._~:/?#\[\]@!$&'()*+,;=%]+/g;

    // Render plain text into `el`, turning URLs into safe, clickable links.
    function renderLinked(el, text) {
      el.replaceChildren();
      let last = 0;
      for (const m of text.matchAll(URL_RE)) {
        const url = m[0].replace(/[.,;:!?)'\]]+$/, "");   // keep trailing punctuation as text
        if (!url) continue;
        el.append(text.slice(last, m.index));
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url;
        el.append(a);
        last = m.index + url.length;
      }
      el.append(text.slice(last));
    }

    function questionCount() {
      return chatHistory.filter((m) => m.role === "user").length;
    }

    function lockChat() {
      if (locked) return;
      locked = true;
      input.disabled = true;
      send.disabled = true;
      input.placeholder = "已完成 5 個問題，感謝您的提問！";
      addNote(`已完成 ${MAX_QUESTIONS} 個問題。重新整理頁面即可重新開始。`);
    }

    async function ask(question) {
      addMessage("user", question);
      chatHistory.push({ role: "user", content: question });
      send.disabled = true;

      let bubble = addMessage("assistant", "");
      showThinking(bubble);

      let current = "answer";     // which bubble we are streaming into: "answer" | "summary"
      let text = "";              // text of the current bubble
      let answer = "";            // answer text only (this is what goes into the history)
      let summaryStartedAt = 0;   // when the cover-letter bubble opened

      const write = (part) => {
        if (!part) return;
        text += part;
        if (current === "summary") renderLinked(bubble, text);   // clickable links in the cover letter
        else bubble.textContent = text;
        if (current === "answer") answer = text;
        chat.scrollTop = chat.scrollHeight;
      };

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, history: chatHistory.slice(0, -1) }),
        });
        if (!res.ok) throw new Error("Something went wrong. Please try again.");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const parts = decoder.decode(value, { stream: true }).split(SEP);
          for (const [i, part] of parts.entries()) {
            if (i > 0) {
              // separator reached: the cover letter gets its own message bubble
              current = "summary";
              text = "";
              bubble = addMessage("assistant", "", "summary");
              showThinking(bubble);
              summaryStartedAt = Date.now();
            }
            if (part && current === "summary") {
              // hold the letter back until SUMMARY_DELAY_MS has passed since the bubble opened
              const remaining = SUMMARY_DELAY_MS - (Date.now() - summaryStartedAt);
              if (remaining > 0) await wait(remaining);
            }
            write(part);
          }
        }

        if (!answer) throw new Error("沒有收到回覆，請再試一次。");
        chatHistory.push({ role: "assistant", content: answer });
      } catch (err) {
        bubble.className = "msg assistant error";
        bubble.textContent = err.message;
        chatHistory.pop();        // let the person retry (removes the user message)
      } finally {
        if (questionCount() >= MAX_QUESTIONS) {
          lockChat();
        } else {
          send.disabled = false;
          input.focus();
        }
        chat.scrollTop = chat.scrollHeight;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (locked || send.disabled) return;
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      ask(q);
    });
  </script>
</body>

</html>
